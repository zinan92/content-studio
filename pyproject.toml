[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-studio"
version = "0.2.0"
description = "Local-first content-production workbench for one creator: Obsidian inbox → topics → outline → edit progress → publish → review"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
content-studio = "content_studio.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_studio = ["static/*", "examples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
