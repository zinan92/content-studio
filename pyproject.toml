[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-studio"
version = "0.1.0"
description = "Local-first content monitoring and analysis for Park"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
content-studio = "content_studio.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
